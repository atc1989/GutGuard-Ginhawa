@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Anton&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;overflow-x:hidden;}
.gh{height:100svh;height:100dvh;overflow-y:auto;background:${w.paper};color:${w.ink};
    font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-overflow-scrolling:touch;}
.gh *{max-width:100%;}
h1,h2,h3,p,ul{margin:0;overflow-wrap:anywhere;}
button,input{font-family:inherit;}
button{border:none;cursor:pointer;min-height:52px;}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid ${w.gold};outline-offset:2px;}
.tap{transition:transform .08s ease;} .tap:active{transform:scale(.985);}
.grow{flex:1;min-width:0;}

/* hero */
.hero-g{position:absolute;top:52%;right:-18%;transform:translateY(-50%);height:74%;width:auto;
        max-width:none;opacity:.055;pointer-events:none;z-index:0;
        filter:saturate(0) brightness(1.6);}
.hero-in{position:relative;z-index:1;}
.hero{background:linear-gradient(158deg,${w.brand},${w.brandD} 62%,${w.navyD});color:#fff;
      padding:0 0 34px;position:relative;overflow:hidden;
      background-image:linear-gradient(158deg,${w.brand},${w.brandD} 62%,${w.navyD}),
                       repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px);}
.hero-in{max-width:520px;margin:0 auto;padding:26px 20px 0;}
.brandline{display:flex;align-items:flex-end;gap:9px;}
.ghw{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:21px;line-height:.95;color:${w.gold};}
.hero h1{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(38px,10.5vw,54px);line-height:1.0;
         letter-spacing:-.032em;margin-top:24px;}
.when{display:flex;flex-direction:column;margin-top:16px;padding-left:14px;border-left:3px solid ${w.gold};}
.when b{font-size:18px;font-weight:700;}
.when span{font-size:16px;color:rgba(255,255,255,.82);}
.docs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;}
.doc{flex:1 1 200px;display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.1);
     border:1px solid rgba(255,255,255,.18);border-radius:13px;padding:11px 13px;}
.ini{width:38px;height:38px;border-radius:50%;background:${w.gold};color:${w.navy};flex-shrink:0;
     display:grid;place-items:center;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;}
.doc b{display:block;font-family:'Sora',sans-serif;font-size:16px;font-weight:600;letter-spacing:-.01em;}
.doc em{display:block;font-size:13px;font-style:normal;color:rgba(255,255,255,.75);}
.hero-what{font-size:15.5px;color:rgba(255,255,255,.88);margin-top:16px;}
.cta{background:${w.gold};color:${w.navy};border-radius:14px;font-family:'Sora',sans-serif;
     font-weight:700;font-size:17px;padding:0 26px;min-height:56px;
     box-shadow:0 10px 26px -12px rgba(0,0,0,.5);}
.cta.big{width:100%;margin-top:22px;min-height:60px;font-size:18px;}
.cta.wide{width:100%;margin-top:18px;}
.cta.ghost{background:transparent;border:2px solid ${w.line};color:${w.navy};box-shadow:none;
           display:flex;align-items:center;justify-content:center;text-decoration:none;}
.cta:disabled{background:#dfe5ec;color:#9aa7b8;box-shadow:none;cursor:not-allowed;}
.hero-note{text-align:center;font-size:14px;color:rgba(255,255,255,.8);margin-top:12px;}

/* layout */
.wrap{max-width:520px;margin:0 auto;padding:0 20px 140px;}
section{padding:38px 0;border-bottom:1px solid ${w.line};}
section:last-of-type{border-bottom:none;}
.sec{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;letter-spacing:.13em;
     text-transform:uppercase;color:${w.mute};margin-bottom:14px;}

/* the ask */
.ask h2{font-family:'Sora',sans-serif;font-size:clamp(25px,6.6vw,31px);font-weight:700;color:${w.navy};
        line-height:1.22;letter-spacing:-.018em;}
.ask p{margin-top:14px;font-size:16.5px;color:${w.ink};}
.ask-hit{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:${w.navy};
         margin-top:20px !important;padding-top:18px;border-top:2px solid ${L.amber};display:inline-block;}

/* gut */
.gut{background:${w.cream};border:1px solid #E8E2D4;border-radius:18px;padding:24px 20px;margin:6px 0;}
.gut-mark{opacity:.9;margin-bottom:12px;}
.gut h3{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:${w.navy};}
.gut p{margin-top:11px;font-size:16px;}
.gut-close{color:${w.mute};font-style:italic;}

/* steps */
.step{display:flex;gap:15px;align-items:flex-start;padding-bottom:20px;position:relative;}
.step:not(.last):before{content:"";position:absolute;left:16px;top:36px;bottom:2px;
                                width:2px;background:linear-gradient(${L.amber},rgba(245,183,22,.2));}
.step.last{padding-bottom:22px;}
.num{width:34px;height:34px;border-radius:50%;background:${w.navy};color:#fff;flex-shrink:0;z-index:1;
     display:grid;place-items:center;font-family:'Sora',sans-serif;font-weight:700;font-size:15px;
     box-shadow:0 0 0 4px ${w.paper};}
.step b{display:block;font-family:'Sora',sans-serif;font-size:17px;font-weight:600;color:${w.navy};}
.step em{display:block;font-style:normal;font-size:15.5px;color:${w.mute};margin-top:3px;}
.promises{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.promises span{background:${w.goodBg};color:${w.good};border:1px solid #BFE4CE;border-radius:999px;
               padding:9px 15px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;}
.promises span:before{content:"";width:6px;height:6px;border-radius:50%;background:${w.good};flex-shrink:0;}

/* bring */
.bring ul{list-style:none;padding:0;}
.bring li{position:relative;padding-left:26px;font-size:16px;margin-bottom:10px;}
.bring li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;border-radius:50%;background:${w.gold};}

/* form */
.book{background:${w.card};border:1.5px solid ${w.line};border-top:4px solid ${L.amber};
      border-radius:20px;padding:26px 20px;box-shadow:0 24px 50px -30px rgba(14,34,73,.45);
      scroll-margin-top:20px;}
.book h3{font-family:'Sora',sans-serif;font-size:23px;font-weight:700;color:${w.navy};margin-bottom:16px;}
.seatline{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.seatbar{flex:1;height:8px;border-radius:99px;background:#e8edf4;overflow:hidden;}
.seatbar i{display:block;height:100%;background:${w.gold};}
.seatline b{font-family:'Sora',sans-serif;font-size:14px;color:${w.goldD};white-space:nowrap;}
label{display:block;margin-bottom:14px;}
label span{display:block;font-size:14px;font-weight:600;color:${w.mute};margin-bottom:6px;}
input{width:100%;font-size:16px;padding:15px 15px;border:2px solid ${w.line};border-radius:13px;
      color:${w.navy};background:#fff;min-height:54px;}
input::placeholder{color:#aab6c6;}
.fine{font-size:13.5px;color:${w.mute};margin-top:10px;text-align:center;line-height:1.55;}
.done{text-align:center;padding:6px 0;}
.tick{width:58px;height:58px;border-radius:50%;background:${w.goodBg};border:2px solid ${w.good};
      color:${w.good};font-size:28px;font-weight:800;display:grid;place-items:center;margin:0 auto 16px;}
.done p{font-size:16.5px;margin-top:8px;}
.done-card{background:${w.paper};border:1px solid ${w.line};border-radius:12px;padding:13px 15px;
           margin-top:14px !important;font-size:15px;line-height:1.6;}
.done-card b{font-family:'Sora',sans-serif;color:${w.navy};}
.hero-booked{display:flex;align-items:center;gap:13px;margin-top:22px;background:rgba(255,255,255,.12);
             border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:15px 16px;}
.hb-tick{width:38px;height:38px;border-radius:50%;background:${L.green};color:#fff;flex-shrink:0;
         display:grid;place-items:center;font-size:19px;font-weight:800;}
.hero-booked b{display:block;font-family:'Sora',sans-serif;font-size:17px;color:#fff;}
.hero-booked em{display:block;font-style:normal;font-size:14.5px;color:rgba(255,255,255,.8);margin-top:2px;}

/* where */
.venue{background:${w.card};border:1px solid ${w.line};border-radius:16px;padding:18px;}
.venue b{display:block;font-family:'Sora',sans-serif;font-size:17px;color:${w.navy};}
.venue em{display:block;font-style:normal;font-size:15.5px;color:${w.mute};margin-top:4px;}
.maplink{display:inline-block;margin-top:12px;color:${w.blue};font-weight:700;font-size:15.5px;
         text-decoration:none;min-height:44px;line-height:44px;}

/* why */
.why p{font-size:16px;}
.why-hit{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:${w.navy};margin-top:12px !important;}

/* footer */
.foot{padding:30px 0 10px;text-align:center;border-top:1px solid ${w.line};margin-top:10px;}
.foot p{font-size:14px;color:${w.mute};}
.legal{font-size:12.5px;margin-top:8px;color:#8a97a8;}

/* the gift \u2014 the card itself */
.gift{padding:28px 0;border-bottom:none;}
.gift-lead{text-align:center;margin-bottom:18px;}
.gift-eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:${L.amberDeep};}
.gift-lead h3{font-family:'Sora',sans-serif;font-size:26px;font-weight:700;color:${w.navy};margin-top:8px;letter-spacing:-.015em;}

/* the Lifestyle Card face \u2014 values taken from GutguardLifestyle.html */
.lc{position:relative;background:${du.bg};border-radius:${du.radius}px;overflow:hidden;isolation:isolate;
    box-shadow:0 26px 50px -22px rgba(0,27,117,.55);}
.lc-body{padding:20px 20px 16px;position:relative;}
.lc-chev{position:absolute;top:10px;right:12px;z-index:3;width:26px;height:26px;border-radius:999px;
         background:rgba(255,255,255,.14);color:rgba(223,215,213,.9);font-size:11px;line-height:1;
         display:flex;align-items:center;justify-content:center;}
.lc-brand{margin-bottom:12px;position:relative;z-index:2;text-align:center;}
.lc-lifestyle{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:16px;
              color:${L.silver};margin-top:1px;}
.lc-name{font-family:'Sora',sans-serif;font-size:clamp(17px,5.4vw,22px);font-weight:700;letter-spacing:.05em;
         text-transform:uppercase;color:${L.white};line-height:1.15;text-align:center;
         text-shadow:1px 2px 3px rgba(0,0,0,.4);}
.lc-state{font-size:10px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
          color:rgba(223,215,213,.55);margin-top:4px;text-align:center;}
.lc-no{text-align:center;font-size:12.5px;font-weight:500;color:rgba(223,215,213,.9);
       letter-spacing:.1em;margin-top:6px;}
.lc-since{text-align:center;font-size:8.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
          color:rgba(223,215,213,.66);margin-top:5px;}
.lc-row{display:flex;align-items:flex-end;gap:10px;margin-top:10px;}
.lc-pad{width:46px;flex-shrink:0;}
.lc-pts{flex:1;text-align:center;min-width:0;}
.lc-num{font-family:'Anton',sans-serif;font-weight:400;font-size:60px;line-height:.9;color:${L.amber};
        text-shadow:0 4px 18px rgba(0,0,0,.35);}
.lc-lbl{font-size:10.5px;font-weight:700;letter-spacing:.3em;color:rgba(223,215,213,.85);margin-top:4px;}
.lc-qr{width:46px;flex-shrink:0;background:${L.white};padding:5px;border-radius:8px;line-height:0;
       box-shadow:0 3px 10px rgba(0,0,0,.25);display:block;}

/* QR panel under the card */
.qrcard{display:flex;align-items:center;gap:16px;margin-top:14px;background:${w.card};
        border:1.5px solid ${w.line};border-radius:16px;padding:16px;}
.qr-left{flex:1;min-width:0;}
.qr-eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.24em;color:${L.amberDeep};}
.qr-left b{display:block;font-family:'Sora',sans-serif;font-size:17px;color:${w.navy};margin-top:6px;}
.qr-left em{display:block;font-style:normal;font-size:13.5px;color:${w.mute};letter-spacing:.06em;margin-top:3px;}
.btn-dl{margin-top:12px;background:${w.navy};color:#fff;border-radius:10px;padding:0 16px;min-height:44px;
        font-size:13.5px;font-weight:700;font-family:'Sora',sans-serif;}
.qr-right{flex-shrink:0;background:#fff;padding:6px;border-radius:10px;border:1px solid ${w.line};line-height:0;}
.qr-right svg{width:min(112px,28vw);height:min(112px,28vw);display:block;}

/* claim affordance */
.lc-claim{background:transparent;border:1.5px dashed rgba(223,215,213,.5);border-radius:10px;
          width:100%;padding:8px 10px;color:rgba(223,215,213,.85);position:relative;min-height:0;}
.lc-tapme{display:block;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.2em;
          color:${L.amber};margin-top:4px;text-transform:uppercase;}
.lc-state.on{color:${L.amber};}
.lc-num.beat{animation:gPts 4.6s cubic-bezier(.34,1.4,.5,1) infinite;transform-origin:center bottom;}
.lc-qr:disabled{opacity:.75;cursor:default;}
@keyframes gBreathe{0%,100%{opacity:.55}50%{opacity:.95}}
@keyframes gPts{0%,72%,100%{transform:translateY(0) scale(1)}80%{transform:translateY(-4px) scale(1.045)}}

/* confetti */
.cf-wrap{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden;}
.cf{position:absolute;top:30%;border-radius:2px;animation-name:cf;
    animation-timing-function:cubic-bezier(.15,.6,.4,1);animation-fill-mode:forwards;}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}
              100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}

/* claim sheet */
.claim-head{margin-bottom:16px;}
.claim-head h3{font-family:'Sora',sans-serif;font-size:23px;font-weight:700;color:${w.navy};margin-top:8px;}

/* notes under the card */
.gift-notes{margin-top:20px;display:grid;gap:14px;}
.gn{display:flex;gap:12px;align-items:flex-start;}
.gn .dot{width:9px;height:9px;border-radius:50%;background:${L.amber};flex-shrink:0;margin-top:8px;}
.gn b{display:block;font-family:'Sora',sans-serif;font-size:16px;font-weight:600;color:${w.navy};}
.gn em{display:block;font-style:normal;font-size:15px;color:${w.mute};margin-top:3px;line-height:1.5;}
.gift-fine{font-size:13.5px;color:${w.mute};margin-top:18px;text-align:center;line-height:1.55;}

/* hero ribbon *//* hero ribbon */
.hero-gift{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap;
           margin-top:14px;background:rgba(245,183,22,.14);border:1px solid rgba(245,183,22,.45);
           border-radius:12px;padding:11px 14px;}
.hero-gift b{font-family:'Sora',sans-serif;font-size:16px;color:${w.gold};}
.hero-gift em{font-style:normal;font-size:14px;color:rgba(255,255,255,.8);}

/* meet them */
.meet{padding-top:26px;}
.video{border-radius:16px;overflow:hidden;background:${w.navy};aspect-ratio:16/9;}
.video video{width:100%;height:100%;display:block;object-fit:cover;background:#000;}
.video-ph{width:100%;height:100%;min-height:0;border:none;background:linear-gradient(158deg,${w.brand},${w.navyD});
          background-size:cover;background-position:center;display:grid;place-items:center;position:relative;}
.play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.94);color:${w.navy};
      font-size:22px;display:grid;place-items:center;box-shadow:0 8px 26px rgba(0,0,0,.35);padding-left:4px;}
.vlen{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;
      font-weight:600;padding:4px 9px;border-radius:6px;}
.vcap{font-size:15px;color:${w.mute};margin-top:12px;text-align:center;}

/* clinician cards */
.doc{width:100%;text-align:left;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);
     border-radius:15px;padding:13px 14px;display:flex;align-items:center;gap:13px;color:#fff;min-height:72px;
     transition:background .16s ease,border-color .16s ease;}
.doc:hover{background:rgba(255,255,255,.14);border-color:rgba(245,183,22,.45);}
.doc-txt{flex:1;min-width:0;}
.doc-more{font-size:12.5px;color:${w.gold};font-weight:700;white-space:nowrap;}
img.ini{object-fit:cover;}

/* credentials sheet */
.modal{position:fixed;inset:0;z-index:60;background:rgba(14,34,73,.6);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:${w.card};
       border-radius:20px 20px 0 0;padding:14px 20px calc(26px + env(safe-area-inset-bottom));}
.grab{width:40px;height:4px;border-radius:2px;background:${w.line};margin:0 auto 16px;}
.cred-head{display:flex;align-items:center;gap:13px;}
.cred-photo{width:56px;height:56px;border-radius:50%;flex-shrink:0;object-fit:cover;}
.cred-photo.ph{background:${w.navy};color:#fff;display:grid;place-items:center;
               font-family:'Sora',sans-serif;font-weight:700;font-size:18px;}
.cred-head b{display:block;font-family:'Sora',sans-serif;font-size:18px;color:${w.navy};}
.cred-head em{display:block;font-style:normal;font-size:14.5px;color:${w.mute};}
.pill{background:${w.paper};border:1px solid ${w.line};border-radius:999px;padding:0 16px;
      min-height:44px;font-size:13.5px;font-weight:600;color:${w.mute};}
.creds{list-style:none;padding:0;margin:20px 0 0;}
.creds li{position:relative;padding-left:26px;font-size:16px;margin-bottom:11px;}
.creds li:before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;background:${w.gold};}
.licence{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;
         background:${w.paper};border:1px solid ${w.line};border-radius:12px;padding:13px 15px;}
.licence span{font-size:14px;color:${w.mute};}
.licence b{font-family:'Sora',sans-serif;font-size:15px;color:${w.navy};}
.cred-line{font-size:15.5px;color:${w.ink};margin-top:14px;}

/* sticky */
.stick{position:fixed;left:0;right:0;bottom:0;z-index:50;pointer-events:none;}
.stick.hide{display:none;}
.stick-in{max-width:520px;margin:0 auto;pointer-events:auto;background:${w.navy};border-radius:16px 16px 0 0;
          padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;
          box-shadow:0 -8px 30px rgba(8,20,46,.35);
          transform:translateY(130%);visibility:hidden;
          transition:transform .3s cubic-bezier(.4,0,.2,1),visibility 0s linear .3s;}
.stick.on .stick-in{transform:translateY(0);visibility:visible;transition:transform .3s cubic-bezier(.4,0,.2,1),visibility 0s;}
.stick-in b{display:block;font-family:'Sora',sans-serif;font-size:15px;color:#fff;}
.stick-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:6px 0 5px;}
.stick-bar i{display:block;height:100%;background:${L.amber};transition:width .4s cubic-bezier(.4,0,.2,1);}
.stick-in em{display:block;font-style:normal;font-size:13px;color:${w.gold};}
.stick .cta{min-height:48px;font-size:15.5px;padding:0 20px;}

@media(min-width:760px){
  .hero-in,.wrap,.stick-in{max-width:620px;}
  .hero h1{font-size:52px;}
}
@media(max-width:360px){
  .hero-in,.wrap{padding-left:16px;padding-right:16px;}
  .gh{font-size:15.5px;}
}
@media(prefers-reduced-motion:reduce){.stick-in{transition:none;}}
