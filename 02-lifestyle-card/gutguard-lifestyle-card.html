children:`
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Anton&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;margin:0;}
.gg{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;background:${d.paper};color:${d.ink};
    font-family:'Inter',system-ui,sans-serif;font-size:15px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;}
.gg *{max-width:100%;}
input{font-size:16px !important;}
button{font-family:'Sora',system-ui,sans-serif;border:none;cursor:pointer;min-height:44px;}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid ${d.blue};outline-offset:2px;}
.tap{transition:transform .08s ease;} .tap:active{transform:scale(.98);}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.col{max-width:440px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 130px;}
h1,h2,h3,p{margin:0;overflow-wrap:anywhere;}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 2px 4px;}
.brand{display:flex;align-items:flex-end;gap:8px;}
.serif{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:19px;line-height:.95;color:${d.navy};}
.mast-actions{display:flex;gap:8px;}
.icon-btn{position:relative;width:44px;height:44px;border-radius:999px;background:${d.card};
          border:1.5px solid ${d.line};display:grid;place-items:center;}
.icon-btn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:99px;background:${d.clay};border:2px solid #fff;}
.sub{font-size:13.5px;color:${d.mute};padding:0 2px 10px;}

/* blocks */
.panel{background:${d.card};border:1.5px solid ${d.line};border-radius:18px;padding:18px 16px;margin-bottom:12px;}
.hero{background:${P1};color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:12px;}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
.eyebrow-dark{font-family:'Sora',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
              color:${d.mute};font-weight:600;margin:0 0 10px;}
.eyebrow-dark.mt{margin-top:22px;}
.h1{font-family:'Sora',sans-serif;font-size:21px;font-weight:700;color:${d.navy};line-height:1.32;}
.h1.white{color:#fff;margin-top:6px;}
.h2{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;color:${d.navy};}
.lead{font-size:14.5px;color:${d.mute};margin-top:8px;line-height:1.62;}
.lead.white{color:rgba(255,255,255,.92);}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.grow{flex:1;min-width:0;}
.mb{margin-bottom:12px;}
.mt{margin-top:14px;}
.center{text-align:center;}
.fine{font-size:12.5px;color:${d.mute};line-height:1.55;margin-top:8px;}
.sec-title{font-family:'Anton',sans-serif;font-size:15px;letter-spacing:.11em;text-transform:uppercase;
           color:${d.navy};margin:22px 0 12px;display:flex;justify-content:space-between;align-items:baseline;}
.of{font-family:'Inter',sans-serif;font-size:12.5px;letter-spacing:0;text-transform:none;color:${d.mute};font-weight:500;}

/* buttons */
.btn{border-radius:12px;font-size:15px;font-weight:700;padding:0 18px;min-height:48px;}
.btn.wide{width:100%;margin-top:14px;}
.btn.sm{min-height:40px;font-size:13px;padding:0 14px;margin-top:10px;}
.btn.primary{background:${d.blue};color:#fff;}
.btn.navy{background:${d.navy};color:#fff;}
.btn.white{background:#fff;color:${d.navy};}
.btn.outline{background:#fff;border:1.5px solid ${d.line};color:${d.navy};}
.btn.ghost-good{background:transparent;border:1.5px solid ${d.good};color:${d.good};min-height:44px;padding:0 18px;font-size:14px;}
.btn:disabled{background:${d.line};color:${d.mute};cursor:not-allowed;}
.link{background:none;color:${d.mute};font-size:13.5px;font-weight:600;text-decoration:underline;padding:12px 0 0;}
.pill{background:${d.card};border:1px solid ${d.line};border-radius:20px;padding:0 18px;min-height:44px;font-size:13.5px;font-weight:600;color:${d.mute};}

/* dose setting */
.slot-set{background:#fff;border:1px solid #EEF1F6;border-radius:12px;padding:12px 14px;margin-top:10px;}
.slot-set.on{border-color:${d.line};}
.slot-head{display:flex;align-items:center;gap:12px;}
.slot-name{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;color:${d.navy};}
.slot-name.big{font-size:17.5px;font-weight:700;}
.slot-note{font-size:13px;color:${d.mute};margin-top:2px;}
.stepper{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.step{width:44px;height:44px;border-radius:11px;background:${d.navy};color:#fff;font-size:21px;font-weight:700;
      display:flex;align-items:center;justify-content:center;line-height:1;}
.step:disabled{background:#F1F4F8;color:#C3CCD8;}
.count{width:46px;text-align:center;}
.count b{font-family:'Anton',sans-serif;font-size:20px;color:${d.navy};font-weight:400;}
.count span{display:block;font-size:9px;color:${d.mute};margin-top:-2px;}
.count em{font-size:12.5px;color:${d.mute};font-style:normal;}
.remind{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid ${d.line};}
.remind span{font-size:12.5px;color:${d.mute};}
.remind input{font-weight:600;padding:8px 10px;border:1.5px solid ${d.line};border-radius:9px;color:${d.navy};
              font-family:'Sora',sans-serif;background:#fff;}
.total{font-size:12.5px;color:${d.mute};margin-top:10px;}
.total b{color:${d.navy};} .total.under,.total.under b{color:${d.clay};}

/* today's doses */
.count-pill{font-size:14.5px;font-weight:700;color:${d.mute};}
.count-pill.done{color:${d.good};}
.slot{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid ${d.line};
      border-radius:13px;padding:15px;margin-top:10px;}
.slot.done{background:${d.goodBg};border-color:${d.good};}
.slot.done .slot-name{color:${d.good};}
.tick{width:40px;height:40px;border-radius:8px;background:${d.good};color:#fff;font-size:22px;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* progress */
.progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:18px;}
.progress-head b{font-family:'Sora',sans-serif;font-size:17px;color:${d.navy};}
.progress-head span{font-size:13.5px;color:${d.mute};}
.bar{height:10px;border-radius:99px;background:#e8edf4;overflow:hidden;margin-top:10px;}
.bar i{display:block;height:100%;background:${d.gold};transition:width .45s cubic-bezier(.4,0,.2,1);}
.bar.sm{height:8px;margin-top:0;}

/* day notes */
.note{background:#fff;border:1.5px solid ${d.line};border-left-width:4px;border-radius:13px;padding:14px 15px;margin-top:12px;}
.note-label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.note-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:600;color:${d.navy};margin-top:5px;line-height:1.35;}
.note-body{font-size:14px;color:${d.ink};margin-top:5px;line-height:1.6;}
.touch{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid ${d.blue};
       border-radius:13px;padding:13px 14px;margin-top:10px;}
.avatar{width:38px;height:38px;border-radius:99px;background:${d.blue};color:#fff;flex-shrink:0;
        display:grid;place-items:center;font-family:'Sora',sans-serif;font-weight:700;font-size:14px;}

/* why */
.why{margin-top:4px;padding-top:12px;border-top:1px solid ${d.line};}
.why-row{display:flex;gap:11px;align-items:flex-start;padding-bottom:11px;}
.pip{width:8px;height:8px;border-radius:99px;background:${d.gold};flex-shrink:0;margin-top:6px;}
.why-row b{display:block;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;color:${d.navy};}
.why-row em{display:block;font-size:13.5px;color:${d.mute};font-style:normal;margin-top:1px;}

/* stats */
.stats{display:flex;gap:10px;margin-top:16px;}
.stat{flex:1;background:${d.paper};border:1px solid ${d.line};border-radius:12px;padding:12px 8px;text-align:center;}
.stat b{display:block;font-family:'Anton',sans-serif;font-size:24px;font-weight:400;line-height:1;}
.stat span{display:block;font-size:11.5px;color:${d.mute};margin-top:5px;}

/* next up */
.next-up{display:flex;align-items:center;gap:12px;background:${d.paper};border:1px solid ${d.line};
         border-radius:13px;padding:13px 14px;margin-top:12px;}
.next-up b{display:block;font-family:'Sora',sans-serif;font-size:15px;color:${d.navy};}
.next-up em{display:block;font-size:13px;color:${d.mute};font-style:normal;margin-top:2px;line-height:1.5;}
.ring{width:48px;height:48px;border-radius:99px;flex-shrink:0;display:grid;place-items:center;}
.ring span{width:36px;height:36px;border-radius:99px;background:#fff;display:grid;place-items:center;
           font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:${d.navy};}

/* supply */
.supply{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid ${d.line};}
.supply span{display:block;font-size:13.5px;color:${d.mute};}
.supply b{display:block;font-family:'Sora',sans-serif;font-size:15.5px;margin-top:2px;}
.paid{display:block;font-size:13px;color:${d.mute};font-style:normal;margin-top:4px;line-height:1.5;}
.paid.warn{color:${d.warn};font-weight:600;}

/* set-up list */
.setup{list-style:none;margin:0;padding:0;}
.setup-row{display:flex;gap:12px;}
.spine{width:30px;position:relative;flex-shrink:0;}
.rail{position:absolute;left:14px;width:2px;}
.node{position:absolute;left:3px;top:16px;width:24px;height:24px;border-radius:99px;background:#fff;
      border:2.5px solid #c3cedd;display:grid;place-items:center;color:${d.navy};font-size:13px;font-weight:800;
      font-family:'Sora',sans-serif;z-index:1;}
.node.on{background:${d.gold};border-color:${d.gold};}
.setup-card{flex:1;min-width:0;background:${d.card};border:1.5px solid ${d.line};border-radius:14px;
            padding:14px 15px;margin-bottom:10px;}
.setup-card.due{border-color:${d.blue};}
.setup-head h3{font-family:'Sora',sans-serif;font-size:16px;font-weight:600;color:${d.navy};line-height:1.35;}
.setup-head p{font-size:14px;margin-top:5px;line-height:1.5;}
.setup-body{margin-top:12px;padding-top:12px;border-top:1px solid ${d.line};}
.choice{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 14px;min-height:52px;
        border-radius:12px;background:#fff;border:1.5px solid ${d.line};font-size:15px;font-weight:600;color:${d.navy};margin-top:8px;}
.choice.on{background:#F2F7FD;border-color:${d.blue};}
.choice.big{min-height:58px;font-size:16px;}
.radio{width:24px;height:24px;border-radius:99px;flex-shrink:0;display:grid;place-items:center;
       background:#fff;border:2px solid #c3cedd;color:${d.mute};font-size:12.5px;font-weight:800;}
.choice.on .radio{background:${d.blue};border-color:${d.blue};color:#fff;}

/* calendar */
.cal-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;
          background:transparent;padding:22px 2px 12px;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-h{text-align:center;font-family:'Sora',sans-serif;font-size:11px;color:${d.mute};font-weight:600;}
.cal-c{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;
       font-family:'Sora',sans-serif;font-size:15px;font-weight:700;}

/* sticky footer */
.gg-foot{position:fixed;left:0;right:0;bottom:0;z-index:45;pointer-events:none;}
.gg-foot-inner{max-width:440px;margin:0 auto;pointer-events:auto;background:#fff;border-top:1px solid ${d.line};
  box-shadow:0 -6px 24px rgba(15,36,68,.12);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;
  transform:translateY(125%);visibility:hidden;
  transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s linear .28s;}
.gg-foot.on .gg-foot-inner{transform:translateY(0);visibility:visible;
  transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s;}
.foot-eyebrow{font-family:'Sora',sans-serif;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:${d.mute};font-weight:600;}
.foot-days{font-family:'Sora',sans-serif;font-size:17px;font-weight:700;line-height:1.1;}
.foot-note{font-size:13px;color:${d.mute};text-align:center;margin-top:18px;line-height:1.6;}

/* sheets */
.modal{position:fixed;inset:0;z-index:60;background:rgba(14,34,73,.55);display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:440px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:${d.card};
       border-radius:20px 20px 0 0;padding:14px 16px calc(26px + env(safe-area-inset-bottom));outline:none;}
.grab{width:40px;height:4px;border-radius:2px;background:${d.line};margin:0 auto 14px;}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;}
.center-block{text-align:center;padding:8px 0 4px;}
.big-tick{width:54px;height:54px;border-radius:99px;background:${d.goodBg};border:2px solid ${d.good};
          margin:0 auto 14px;display:grid;place-items:center;color:${d.good};font-size:26px;font-weight:800;}

/* order */
.prog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;min-height:64px;
      border-radius:13px;background:#fff;border:2px solid ${d.line};margin-top:9px;}
.prog.on{background:#F2F7FD;border-color:${d.blue};}
.prog .left b{display:block;font-family:'Sora',sans-serif;font-size:16px;font-weight:700;color:${d.navy};}
.prog .left em{display:block;font-size:13px;color:${d.mute};font-style:normal;margin-top:2px;}
.lasts{text-align:right;flex-shrink:0;}
.lasts b{display:block;font-family:'Anton',sans-serif;font-size:20px;font-weight:400;color:${d.navy};line-height:1;}
.lasts em{display:block;font-size:11.5px;color:${d.mute};font-style:normal;margin-top:2px;}
.collect{margin-top:15px;padding:13px 14px;background:${d.paper};border:1px solid ${d.line};border-radius:13px;}
.collect div{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;}
.collect span{font-size:13.5px;color:${d.mute};}
.collect b{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:${d.navy};}

/* check */
.cmp{padding-bottom:16px;}
.cmp b{font-family:'Sora',sans-serif;font-size:15px;color:${d.navy};}
.cmp .row-between span{font-size:13px;font-weight:700;}
.cmp-row{display:flex;align-items:center;gap:9px;margin-top:6px;}
.cmp-row span{font-size:11.5px;color:${d.mute};width:32px;flex-shrink:0;}
.cmp-row span.now{color:${d.navy};font-weight:700;}
.verdict{background:${d.goodBg};border:1.5px solid ${d.good};border-radius:14px;padding:15px;
         font-size:14.5px;color:${d.good};line-height:1.65;}
.verdict.flat{background:${d.oliveLt};border-color:#d7dccf;color:${d.olive};}

/* notifications */
.notif{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid ${d.line};}
.notif-dot{width:10px;height:10px;border-radius:99px;flex-shrink:0;margin-top:6px;background:${d.gold};}
.notif.page .notif-dot{background:${d.blue};}
.notif.room .notif-dot{background:${d.good};}
.notif b{display:block;font-family:'Sora',sans-serif;font-size:15.5px;font-weight:600;color:${d.navy};}
.notif em{display:block;font-size:14px;color:${d.mute};font-style:normal;margin-top:3px;line-height:1.55;}

/* sync chip */
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 11px;height:44px;border-radius:999px;
      font-size:12px;font-weight:700;white-space:nowrap;border:1px solid ${d.line};background:${d.card};color:${d.mute};}
.chip i{width:8px;height:8px;border-radius:99px;background:${d.mute};}
.chip.ok{background:${d.goodBg};border-color:#BFE4CE;color:${d.good};} .chip.ok i{background:${d.good};}
.chip.down{background:${d.clayBg};border-color:${d.clay};color:${d.clay};} .chip.down i{background:${d.clay};}

/* releases + lapsed */
.releases{margin-top:16px;padding-top:16px;border-top:1px solid ${d.line};}
.rel{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:14.5px;color:${d.navy};}
.rel em{font-size:13.5px;color:${d.mute};font-style:normal;}
.node.sm{position:static;width:22px;height:22px;font-size:12px;border-width:2px;}
.btn.inline{margin-top:0;}
.lapsed{margin-top:16px;padding:15px;background:${d.clayBg};border:1.5px solid ${d.clay};border-radius:14px;}
.lapsed b{font-family:'Sora',sans-serif;font-size:16px;color:${d.clay};}
.lapsed p{font-size:14px;color:${d.ink};margin-top:6px;line-height:1.6;}

/* skip link + about numbers */
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:${d.navy};color:#fff;
      padding:12px 18px;border-radius:10px;font-weight:700;text-decoration:none;}
.skip:focus{left:16px;}
main:focus{outline:none;}
.num{width:26px;height:26px;border-radius:99px;background:${d.navy};color:#fff;flex-shrink:0;
     display:grid;place-items:center;font-family:'Sora',sans-serif;font-weight:700;font-size:13px;}

/* demo */
.demo{margin-top:18px;padding:12px 13px;background:${d.card};border:1.5px dashed ${d.sky};border-radius:13px;}
.demo-label{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${d.mute};margin-bottom:9px;}
.demo-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.demo-btn{flex:1 1 28%;min-height:44px;border-radius:10px;font-size:12px;font-weight:700;
          background:#fff;border:1.5px solid ${d.line};color:${d.mute};}
.demo-btn.on{background:${d.navy};border-color:${d.navy};color:#fff;}

/* toast + confetti */
.toast{position:fixed;left:16px;right:16px;bottom:96px;z-index:70;margin:0 auto;max-width:400px;text-align:center;
       background:${d.navy};color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;
       box-shadow:0 12px 30px -10px rgba(14,34,73,.6);}
.cf-wrap{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden;}
.cf{position:absolute;top:26%;border-radius:2px;animation-name:cf;animation-timing-function:cubic-bezier(.15,.6,.4,1);animation-fill-mode:forwards;}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}} .fade{animation:fade .2s ease;}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}} .up{animation:up .24s ease;}

/* small screens */
@media(max-width:400px){.gg{font-size:14.5px;}.col{padding-left:13px;padding-right:13px;}}
@media(max-width:360px){.col{padding-left:11px;padding-right:11px;}.stats{gap:7px;}.stat b{font-size:20px;}
  .spine{width:24px;}.slot{flex-wrap:wrap;}.slot .btn{width:100%;margin-top:8px;}}
@media(max-width:320px){.col{padding-left:9px;padding-right:9px;}.gg{font-size:14px;}}
@media(max-height:520px){.sheet{max-height:96dvh;}}
@media(prefers-reduced-motion:reduce){.fade,.up,.cf{animation:none;}.gg-foot-inner{transition:none;}}
